version: '3.8'

services:
  trading-bot:
    build: .
    container_name: tradingpartner_bot
    restart: unless-stopped
    ports:
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MT5_HOST=${MT5_HOST:-host.docker.internal}
      - MT5_PORT=${MT5_PORT:-18812}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
