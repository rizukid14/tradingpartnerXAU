version: '3.8'

services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradingpartner:latest
    container_name: tradingpartner_bot
    restart: unless-stopped
    ports:
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MT5_HOST=${MT5_HOST:-host.docker.internal}
      - MT5_PORT=${MT5_PORT:-18812}
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  telegram-bot:
    image: tradingpartner:latest
    container_name: tradingpartner_telegram_bot
    restart: unless-stopped
    depends_on:
      - trading-bot
    environment:
      - API_BASE_URL=http://trading-bot:8765
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "tele_bot/telegram_ai_agent.py"]
